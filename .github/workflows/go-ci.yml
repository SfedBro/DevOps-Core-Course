name: Go CI + Docker Build + Coverage

on:
  push:
    paths:
      - 'app_go/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    paths:
      - 'app_go/**'

jobs:
  test-and-build-go:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sfedbro/app_go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # --------------------
      # Install revive linter
      # --------------------
      - name: Install revive
        run: go install github.com/mgechev/revive@latest

      - name: Run revive linter
        run: $HOME/go/bin/revive -formatter stylish ./...

      # --------------------
      # Run tests with coverage
      # --------------------
      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.out

      # --------------------
      # Upload coverage to Codecov
      # --------------------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
          name: go-coverage

      # --------------------
      # Docker login
      # --------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------
      # Set CalVer tag
      # --------------------
      - name: Set version (CalVer)
        id: version
        run: echo "VERSION=$(date +'%Y.%m')" >> $GITHUB_OUTPUT

      # --------------------
      # Build & push Docker image
      # --------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: app_go
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
