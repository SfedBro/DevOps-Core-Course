name: Go CI + Docker Build + Coverage

on:
  push:
    paths:
      - 'app_go/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    paths:
      - 'app_go/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sfedbro/app_go

    steps:
      # --------------------
      # Checkout code
      # --------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------
      # Setup Go
      # --------------------
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      # --------------------
      # Cache Go modules
      # --------------------
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # --------------------
      # Install dependencies
      # --------------------
      - name: Install dependencies
        working-directory: app_go
        run: go mod tidy

      # --------------------
      # Install and run revive linter
      # --------------------
      - name: Install revive
        run: go install github.com/mgechev/revive@latest

      - name: Run revive linter
        working-directory: app_go
        run: $GOPATH/bin/revive -formatter stylish ./...

      # --------------------
      # Run tests with coverage
      # --------------------
      - name: Run tests
        working-directory: app_go
        run: go test ./... -v -coverprofile=coverage.out

      # --------------------
      # Upload coverage to Codecov
      # --------------------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app_go/coverage.out
          flags: go
          name: go-coverage

      # --------------------
      # Docker login
      # --------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------
      # Set CalVer tag
      # --------------------
      - name: Set version (CalVer)
        id: version
        run: echo "VERSION=$(date +'%Y.%m')" >> $GITHUB_OUTPUT

      # --------------------
      # Build and push Docker image
      # --------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: app_go
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
