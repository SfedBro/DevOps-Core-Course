name: Go CI + Docker Build + Coverage

on:
  push:
    paths:
      - 'app_go/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    paths:
      - 'app_go/**'

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Enable Go modules
        run: go env -w GO111MODULE=on

      - name: Install revive linter
        run: go install github.com/mgechev/revive@latest

      - name: Run linter
        run: $GOPATH/bin/revive -formatter stylish ./app_go/...

      - name: Run tests with coverage
        run: go test ./app_go/... -v -coverprofile=app_go/coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: app_go/coverage.out
          flags: go
          name: go-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test-coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          IMAGE_NAME=sfedbro/app_go
          VERSION=$(date +'%Y.%m')
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest ./app_go
