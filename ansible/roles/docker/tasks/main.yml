---
- name: Docker installation and repository configuration
  become: true
  tags:
    - docker
    - docker_install
  block:
    - name: Install Docker prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - lsb-release
          - python3-docker
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure Docker apt repository
      block:
        - name: Add Docker GPG key
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          ansible.builtin.apt_repository:
            repo: 'deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable'
            state: present
            filename: docker
      rescue:
        - name: Wait before Docker key retry
          ansible.builtin.pause:
            seconds: 10

        - name: Retry apt metadata refresh after GPG failure
          ansible.builtin.apt:
            update_cache: true

        - name: Retry Docker GPG key setup
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

    - name: Install Docker engine packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
        cache_valid_time: 3600
      notify: restart docker
  always:
    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Docker runtime configuration
  become: true
  tags:
    - docker
    - docker_config
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: '{{ docker_user }}'
        groups: docker
        append: true
