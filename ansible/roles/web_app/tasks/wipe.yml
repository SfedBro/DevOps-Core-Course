---
- name: Wipe web application resources
  block:
    - name: Stop and remove compose services
      community.docker.docker_compose_v2:
        project_src: '{{ compose_project_dir }}'
        state: absent
        remove_orphans: true
      ignore_errors: true

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: '{{ compose_project_dir }}/docker-compose.yml'
        state: absent
      ignore_errors: true

    - name: Remove compose project directory
      ansible.builtin.file:
        path: '{{ compose_project_dir }}'
        state: absent
      ignore_errors: true

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: 'Application {{ app_name }} wiped successfully'

  # Double safety: run only if variable true and explicitly tagged
  when: web_app_wipe | bool
  tags:
    - web_app_wipe
