replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: sfedbro/app_go
  tag: latest
  pullPolicy: Always

containerPort: 8080

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30082

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8080"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: false

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  preInstall:
    weight: -5
  postInstall:
    weight: 5
    smokeTestPath: /health
    retries: 15
    sleepSeconds: 2
