# Push branch `lab13` to origin before applying this manifest.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: python-app-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - env: dev
            namespace: dev
            releaseName: python-app-dev
            valuesFile: values-dev.yaml
            serviceType: NodePort
            nodePort: "30083"
            hostPath: /var/local/devops-info-service-dev
            autoSync: "true"
          - env: prod
            namespace: prod
            releaseName: python-app-prod
            valuesFile: values-prod.yaml
            serviceType: ClusterIP
            nodePort: "30084"
            hostPath: /var/local/devops-info-service-prod
            autoSync: "false"
  template:
    metadata:
      name: 'python-app-{{ .env }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io/foreground
    spec:
      project: default
      source:
        repoURL: https://github.com/SfedBro/DevOps-Core-Course.git
        targetRevision: lab13
        path: k8s/mychart
        helm:
          releaseName: '{{ .releaseName }}'
          valueFiles:
            - '{{ .valuesFile }}'
          parameters:
            - name: service.type
              value: '{{ .serviceType }}'
            - name: service.nodePort
              value: '{{ .nodePort }}'
            - name: persistence.hostPath.path
              value: '{{ .hostPath }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    {{- end }}
