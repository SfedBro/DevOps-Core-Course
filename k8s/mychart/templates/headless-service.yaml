{{- if .Values.statefulset.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mychart.headlessServiceName" . }}
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mychart.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
