replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: sfedbro/app_python
  tag: latest
  pullPolicy: Always

containerPort: 5000

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: DEBUG
    value: "false"
  - name: APP_ENV
    value: "dev"

serviceAccount:
  create: true
  name: ""

secrets:
  enabled: true
  nameOverride: ""
  data:
    username: "change-me"
    password: "change-me"

vault:
  enabled: false
  role: "myapp"
  secretPath: "secret/data/myapp/config"
  injectFilename: "config"
  authPath: "auth/kubernetes"
  agent:
    inject: true
    prePopulateOnly: false
    template:
      enabled: true
      filename: "config.env"
      path: "secret/data/myapp/config"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: false

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  preInstall:
    weight: -5
  postInstall:
    weight: 5
    smokeTestPath: /health
    retries: 15
    sleepSeconds: 2

