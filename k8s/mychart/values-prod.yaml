replicaCount: 3
environment: prod
logLevel: info

featureFlags:
  visitsCounter: true
  configHotReload: false

image:
  tag: lab12
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: DEBUG
    value: "false"
  - name: APP_ENV
    value: "prod"
  - name: VISITS_FILE
    value: "/data/visits"
  - name: CONFIG_FILE
    value: "/config/config.json"

configMap:
  env:
    data:
      APP_CONFIG_MODE: configmap
      LOG_LEVEL: info
      FEATURE_VISITS: "true"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 3

hooks:
  postInstall:
    retries: 20
    sleepSeconds: 3

