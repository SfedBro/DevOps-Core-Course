replicaCount: 3

image:
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: DEBUG
    value: "false"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 3

hooks:
  postInstall:
    retries: 20
    sleepSeconds: 3

